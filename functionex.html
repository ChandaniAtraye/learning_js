<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>container</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/style.css"/>
</head>

<body>
    <form name="myform">
        <div class="container mt-4 ">
            <div class="row ">
                
                <div class="col-md-6 cal_box p-3 border border-dark ">
                    <h1 class="text-center">Arithmatic Calculator</h1>
                    <div>
                        <input type="number" name="n1" class="form-control mb-4" id="fornumber" placeholder="Enter number">
                        <input type="number" name="n2" class="form-control" id="fornumber" placeholder="Enter number">
                    </div>
                    <div class="button mt-3 text-center">
                        <button type="button" class="btn btn-success" onlick="add()">+</button>
                        <button type="button" class="btn btn-success" onlick="sub()">-</button>
                        <button type="button" class="btn btn-success"onlick="multi()">*</button>
                        <button type="button" class="btn btn-success " onlick="divi()">/</button>
                        <button type="reset" class="btn btn-success " onlick="divi()">Reset</button>
                    </div>
                    <div class="result mt-3">
                        <!-- <lable for="res"class="form-control > Result:</lable> -->
                        <input type="number" name="res" class="form-control mb-4" id="fornumber" placeholder="Result" disabled>
                    </div>

                </div>
               
            </div>
        </div>
    </form>

    <script>
        var a,b,result;

        function add()
        {
            a=Number(document.myform.n1.value);//1
            b=Number(document.myform.n2.value);//2
            result=a+b; //1 +2

            document.myform.res.value = result.toFixed(2)//3
        }

    </script>
    


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
